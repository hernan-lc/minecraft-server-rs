[package]
name = "guardian"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minecraft server lifecycle manager: environment provisioning, process supervision, crash recovery"
exclude = ["tests/"]

# Built for the integration tests, which reach it through CARGO_BIN_EXE_.
# Excluded from the published crate: it is test scaffolding, not a tool.
[[bin]]
name = "guardian-fake-java"
path = "tests/support/fake_java.rs"
test = false
doc = false

[dependencies]
java-path.workspace = true
minecraft-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
tar = "0.4"
flate2 = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.25"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
futures-util = "0.3"
