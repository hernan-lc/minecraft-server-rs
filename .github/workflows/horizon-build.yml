name: Horizon runtime compatibility
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: Horizon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04, target: aarch64-linux-android }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build and stage runtime
        shell: bash
        run: ./scripts/build-horizon-runtime.sh '${{ matrix.target }}' "$RUNNER_TEMP/horizon"
      - name: Check runtime layout
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/horizon/prepare/research-lock.json"
          test -f "$RUNNER_TEMP/horizon/prepare/mods/horizon/src/test/java/dev/horizonlab/parity/PrepareWorker.java"
          if [[ '${{ matrix.target }}' == *windows* ]]; then
            test -s "$RUNNER_TEMP/horizon/horizon-server.exe"
            test -s "$RUNNER_TEMP/horizon/horizon-engine.exe"
            test -s "$RUNNER_TEMP/horizon/prepare/horizon-prepare.exe"
          else
            test -s "$RUNNER_TEMP/horizon/horizon-server"
            test -s "$RUNNER_TEMP/horizon/horizon-engine"
            test -s "$RUNNER_TEMP/horizon/prepare/horizon-prepare"
          fi
