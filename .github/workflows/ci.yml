name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch is of no interest once a newer commit
# exists, and CI minutes are not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn a bare assertion failure into
  # something diagnosable without pushing a "add a println" commit.
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  backend:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          # java-path and minecraft-core are submodules; without this the
          # workspace does not resolve at all.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-28)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.os }}

      - name: Install the Linux desktop tray dependencies
        # Only the `linux-tray` steps below need these; the default build links
        # none of them, which is what lets the release binary run on a server.
        # packages.microsoft.com intermittently answers 403 on the Azure mirror,
        # which aborts `apt-get update` with exit 100; drop its source list
        # first since everything needed here comes from the Ubuntu archives.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Format
        # Checked on one platform only: the result cannot differ, and running it
        # twice only doubles the time it takes to tell you the same thing.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (Linux desktop tray)
        # The Linux tray is an opt-in feature, so the default run above never
        # compiles it. Without this step a broken tray backend reaches release.
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features panel/linux-tray -- -D warnings

      - name: Dependency advisories
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories

      - name: Test
        # Windows is in the matrix deliberately. The supervisor tests spawn real
        # child processes, and process handling is the part most likely to
        # differ between platforms — so it is the part least worth assuming.
        run: cargo test --workspace

      - name: Test (Linux desktop tray)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --features panel/linux-tray

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Dependency advisories
        working-directory: web
        run: npm audit --audit-level=high

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        # Also type-checks: `npm run build` runs tsc, which is stricter than
        # vitest and has already caught an error the test run did not.
        run: npm run build

  release:
    name: Release binary
    runs-on: ubuntu-latest
    # Only worth building once the pieces it is made of are known to be sound.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-28)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        # Exercises build.sh itself, so the documented way to build the project
        # is the way CI builds it.
        run: ./build.sh

      - name: Check the frontend was embedded
        # A release binary that quietly serves the "frontend not built" page
        # would otherwise look like a successful build.
        run: |
          ./target/release/mcpanel --data-dir ./ci-data --bind 127.0.0.1:8099 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/ >/dev/null && break
            sleep 1
          done
          page=$(curl -s http://127.0.0.1:8099/)
          echo "$page" | grep -q 'assets/index-' \
            || { echo "::error::the release binary is not serving the built frontend"; echo "$page" | head -20; exit 1; }
          echo "frontend embedded and served"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpanel-linux-x86_64
          path: target/release/mcpanel
          retention-days: 14
