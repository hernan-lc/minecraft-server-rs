[workspace]
resolver = "2"
members = ["crates/guardian", "crates/panel", "crates/playit-integration", "crates/tray"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nglmercer/minecraft-server-rs"

[workspace.dependencies]
java-path = { path = "vendor/java-path-rs", features = ["install", "serde"] }
minecraft-core = { path = "vendor/minecraft-core-rs" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
playit-ipc = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}
playit-runtime = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}
playit-api-client = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}

# Keep the edit/check loop light on machines where full debug information is
# expensive to produce and link. Line tables preserve useful backtraces while
# avoiding the larger variable/type debug data. Override with
# CARGO_PROFILE_DEV_DEBUG=2 when a full debugger session needs it.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.test]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
