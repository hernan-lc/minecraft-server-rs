[package]
name = "panel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A single-binary Minecraft server control panel"
build = "build.rs"

[[bin]]
name = "mcpanel"
path = "src/main.rs"

[features]
# Forwarded to the tray crate; see its manifest for why this is off by default.
linux-tray = ["tray/linux-tray"]

[dependencies]
guardian = { path = "crates/guardian" }
playit-integration = { path = "crates/playit-integration" }
tray = { path = "crates/tray" }
java-path.workspace = true
minecraft-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
sysinfo = "0.33"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
jsonwebtoken = { version = "9" }
async-trait = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = ["param"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
playit-runtime.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[workspace]
resolver = "2"
members = ["crates/guardian", "crates/playit-integration", "crates/tray"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hernan-lc/minecraft-server-rs"

[workspace.dependencies]
java-path = { path = "vendor/java-path-rs", features = ["install", "serde"] }
minecraft-core = { path = "vendor/minecraft-core-rs" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
playit-ipc = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}
playit-runtime = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}
playit-api-client = {
    git = "https://github.com/nglmercer/playit-agent",
    rev = "3ba5b703d04a09e2db2fad27f718977e58fd3144"
}

# Keep the edit/check loop light on machines where full debug information is
# expensive to produce and link. Line tables preserve useful backtraces while
# avoiding the larger variable/type debug data. Override with
# CARGO_PROFILE_DEV_DEBUG=2 when a full debugger session needs it.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.test]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
